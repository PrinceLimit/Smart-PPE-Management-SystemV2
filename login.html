<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart Workshop</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1 class="login-title">
                SMART WORKSHOP
            </h1>

            <p class="login-subtitle">
                Tool Management System
            </p>

            <form id="loginForm">

                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    LOGIN
                </button>


                <!-- ERROR MESSAGE -->

                <p
                    id="loginMessage"
                    style="
                        margin-top: 15px;
                        text-align: center;
                        color: red;
                        display: none;
                    "
                ></p>

            </form>


            <p class="footer-text">
                Smart Workshop Management System
            </p>

        </div>

    </div>


    <!-- SUPABASE JAVASCRIPT -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- OUR JAVASCRIPT -->

    <script src="app.js"></script>

</body>

</html>
