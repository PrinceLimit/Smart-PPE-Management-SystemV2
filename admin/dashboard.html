<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - Smart Workshop</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

    <div style="
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
        font-family: Arial, sans-serif;
    ">

        <h1>SMART WORKSHOP</h1>

        <h2>Admin Dashboard</h2>

        <p id="welcomeMessage">
            Loading...
        </p>

        <hr>

        <h3>System Overview</h3>

        <div style="
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        ">

            <div style="
                padding: 20px;
                background: white;
                border-radius: 12px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            ">

                <h3>Students</h3>

                <h2>10</h2>

            </div>


            <div style="
                padding: 20px;
                background: white;
                border-radius: 12px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            ">

                <h3>Tools</h3>

                <h2>5</h2>

            </div>


            <div style="
                padding: 20px;
                background: white;
                border-radius: 12px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            ">

                <h3>Available</h3>

                <h2>5</h2>

            </div>


            <div style="
                padding: 20px;
                background: white;
                border-radius: 12px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            ">

                <h3>In Use</h3>

                <h2>0</h2>

            </div>

        </div>


        <br>

        <button
            onclick="logout()"
            style="
                padding: 12px 20px;
                border: none;
                border-radius: 8px;
                background: #e53935;
                color: white;
                cursor: pointer;
            "
        >
            LOGOUT
        </button>

    </div>


    <script>

        const userData =
            localStorage.getItem(
                "smartWorkshopUser"
            );


        if (!userData) {

            window.location.href =
                "../login.html";

        }
        else {

            const user =
                JSON.parse(userData);


            if (user.role !== "admin") {

                alert(
                    "Access denied."
                );

                window.location.href =
                    "../login.html";

            }
            else {

                document
                    .getElementById(
                        "welcomeMessage"
                    )
                    .textContent =
                    "Welcome, " +
                    user.full_name +
                    " (" +
                    user.username +
                    ")";

            }

        }


        function logout() {

            localStorage.removeItem(
                "smartWorkshopUser"
            );

            window.location.href =
                "../login.html";

        }

    </script>

</body>

</html>
